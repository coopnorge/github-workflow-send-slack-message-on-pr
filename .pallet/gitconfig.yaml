---
# reference https://github.com/coopnorge/cloud-platform-apis/blob/main/cloud-platform-apis/templates/repositoryconfig.github.coop.no/definition.yaml
# status of this repository: https://argocd.internal.coop/applications?search=pallet-send-slack-message-on-pr&showFavorites=false&proj=&sync=&autoSync=&health=&namespace=&cluster=&labels=
apiVersion: github.coop.no/v1alpha1
kind: RepositoryConfig
metadata:
  name: repository-config
spec:
  description: Reusable Github workflow for sending a message to a designated Slack channel whenever a Pull Request is opened or updated.
  visibility: public
  actions:
    enableReusableWorkflowsForOrganizationAccess: true
  branches:
    default: main
    protection:
      - id: main
        pattern: main
        requiredStatusChecks:
          checks:
            - "validate-ci-results"
            - "policy-bot: main"
